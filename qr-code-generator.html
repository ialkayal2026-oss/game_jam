<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#4f46e5,#9333ea);display:flex;justify-content:center;align-items:center;padding:20px}.app{background:white;width:100%;max-width:430px;padding:30px;border-radius:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}h1{margin:0 0 8px}.subtitle{color:#666;margin-bottom:25px}textarea{width:100%;height:100px;resize:none;padding:14px;border:2px solid #ddd;border-radius:12px;font-size:16px;font-family:inherit;outline:none}textarea:focus{border-color:#4f46e5}.controls{margin-top:12px}select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:15px}button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}.generate{width:100%;margin-top:12px;background:#4f46e5;color:white}.generate:hover{background:#4338ca}#qr{margin:25px auto;min-height:20px;display:flex;justify-content:center}#download{display:none;width:100%;background:#111;color:white}#clear{width:100%;margin-top:10px;background:#eee}.status{font-size:13px;color:#777;margin-top:15px}
</style>
</head>
<body>
<div class="app">
<h1>📱 QR Generator</h1>
<div class="subtitle">Turn any text or website into a QR code</div>
<textarea id="input" placeholder="Enter a URL or text..."></textarea>
<div class="controls">
<select id="size">
<option value="180">Small</option><option value="240" selected>Medium</option>
<option value="320">Large</option><option value="400">Extra Large</option>
</select>
</div>
<button class="generate" onclick="generateQR()">Generate QR Code</button>
<div id="qr"></div>
<button id="download" onclick="downloadQR()">⬇️ Download PNG</button>
<button id="clear" onclick="clearQR()">Clear</button>
<div class="status" id="status">Enter something above to get started.</div>
</div>
<script>
let qrCode=null;
function generateQR(){const input=document.getElementById("input").value.trim(),size=Number(document.getElementById("size").value),qr=document.getElementById("qr");if(!input){alert("Please enter a URL or text.");return}qr.innerHTML="";qrCode=new QRCode(qr,{text:input,width:size,height:size,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});document.getElementById("download").style.display="block";document.getElementById("status").textContent="QR code created successfully!"}
function downloadQR(){const canvas=document.querySelector("#qr canvas");if(!canvas){alert("Generate a QR code first.");return}const link=document.createElement("a");link.download="my-qr-code.png";link.href=canvas.toDataURL("image/png");link.click()}
function clearQR(){document.getElementById("input").value="";document.getElementById("qr").innerHTML="";document.getElementById("download").style.display="none";document.getElementById("status").textContent="Enter something above to get started."}
document.getElementById("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();generateQR()}});
</script>
</body>
</html>
