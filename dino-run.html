<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dino Run</title>
<style>
  :root {
    --sand: #f7f4ec;
    --ink: #2b2b26;
    --line: #cfc9b8;
    --accent: #c1440e;
    --sky-1: #fdfbf4;
    --sky-2: #eae4d3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
    touch-action: manipulation;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
  }
  #frame {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 900px;
    max-height: 500px;
    background: linear-gradient(180deg, var(--sky-1), var(--sky-2));
    overflow: hidden;
    border-radius: 0;
    box-shadow: 0 0 0 1px var(--line);
  }
  @media (min-width: 700px) and (min-height: 560px) {
    #frame { border-radius: 14px; }
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 22px;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #score, #hi {
    color: var(--ink);
    font-size: 15px;
    letter-spacing: 0.06em;
    opacity: 0.75;
  }
  #hiWrap { display: flex; gap: 10px; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--ink);
    text-align: center;
    padding: 0 30px;
  }
  #overlay.hidden { display: none; }
  #title {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  #sub {
    font-size: 14px;
    opacity: 0.6;
    max-width: 320px;
    line-height: 1.5;
  }
  #tapHint {
    margin-top: 6px;
    font-size: 13px;
    padding: 10px 20px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    opacity: 0.85;
  }
  .glyph {
    width: 44px; height: 44px;
    margin-bottom: 2px;
  }
  #duckBtn {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0.55;
    z-index: 5;
  }
  #duckBtn.active { opacity: 0.9; background: rgba(43,43,38,0.08); }
  #duckBtn svg { width: 24px; height: 24px; }
  @media (hover: none) and (pointer: coarse) {
    #duckBtn { display: flex; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="score">00000</div>
      <div id="hiWrap"><div id="hi">HI 00000</div></div>
    </div>
    <div id="overlay">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.4">
        <path d="M4 16c0-4 2-7 6-7 1 0 2 .3 2.8 1M12 10c1-2 3-3 5-2.6 1.8.4 3 1.8 3 3.6 0 1.8-1 3-2.3 3.6" stroke-linecap="round"/>
        <circle cx="16.3" cy="8.4" r="0.6" fill="var(--ink)"/>
        <path d="M4 16l-1.5 3M9 16.5V20M13.5 16.8l1 3.2" stroke-linecap="round"/>
      </svg>
      <div id="title">Dino Run</div>
      <div id="sub">No internet needed here either. Jump cacti, duck under birds and low branches, don't stop.</div>
      <div id="hintText">Tap to jump · hold the circle to duck</div>
    </div>
    <button id="duckBtn" aria-label="Duck">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 15h16M8 15V9a4 4 0 018 0v6"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const hintEl = document.getElementById('hintText');
  const scoreEl = document.getElementById('score');
  const hiEl = document.getElementById('hi');
  const frame = document.getElementById('frame');
  const duckBtn = document.getElementById('duckBtn');

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W, H, groundY;

  function resize() {
    const rect = frame.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    groundY = H * 0.72;
  }
  window.addEventListener('resize', resize);
  resize();

  const INK = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
  const ACCENT = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const LINE = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();

  // ---- Game state ----
  let state = 'ready'; // ready | running | dead
  let speed = 6;
  let baseSpeed = 6;
  let gravity = 0.62;
  let score = 0;
  let hi = parseInt(localStorage.getItem('dinoHi') || '0', 10) || 0;
  let groundOffset = 0;
  let obstacles = [];
  let clouds = [];
  let spawnTimer = 0;
  let nextSpawn = 60;
  let frameCount = 0;
  let flashTimer = 0;

  const dino = {
    x: 0,
    y: 0,
    w: 44,
    h: 47,
    duckH: 28,
    vy: 0,
    jumping: false,
    ducking: false,
    legPhase: 0,
    groundY: 0
  };

  function resetDino() {
    dino.w = 44; dino.h = 47;
    dino.x = Math.max(40, W * 0.09);
    dino.y = groundY - dino.h;
    dino.vy = 0;
    dino.jumping = false;
    dino.ducking = false;
  }

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 3; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 20 + Math.random() * (H * 0.35),
        s: 0.7 + Math.random() * 0.8
      });
    }
  }

  function reset() {
    speed = baseSpeed;
    score = 0;
    obstacles = [];
    spawnTimer = 0;
    nextSpawn = 55;
    groundOffset = 0;
    frameCount = 0;
    resetDino();
    initClouds();
    hiEl.textContent = 'HI ' + String(hi).padStart(5, '0');
    scoreEl.textContent = '00000';
  }
  resize();
  reset();

  // ---- Input ----
  function jump() {
    if (state === 'ready') { startGame(); return; }
    if (state === 'dead') { startGame(); return; }
    if (!dino.jumping) {
      dino.jumping = true;
      dino.vy = -12.2;
    }
  }
  function duck(on) {
    if (state !== 'running') return;
    if (!dino.jumping) {
      dino.ducking = on;
      dino.h = on ? dino.duckH : 47;
      dino.y = groundY - dino.h;
    } else if (!on) {
      dino.ducking = false;
    }
  }

  function startGame() {
    reset();
    state = 'running';
    overlay.classList.add('hidden');
  }

  function gameOver() {
    state = 'dead';
    if (score > hi) {
      hi = score;
      localStorage.setItem('dinoHi', String(hi));
    }
    titleEl.textContent = 'Game over';
    subEl.textContent = 'Score ' + String(score).padStart(5, '0') + '   ·   Best ' + String(hi).padStart(5, '0');
    hintEl.textContent = 'Tap or press Space to try again';
    overlay.classList.remove('hidden');
    flashTimer = 8;
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      duck(true);
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') duck(false);
  });

  let touchStartY = 0;
  let duckHeld = false;

  frame.addEventListener('touchstart', (e) => {
    if (e.target === duckBtn || duckBtn.contains(e.target)) return;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
    jump();
  }, { passive: false });
  frame.addEventListener('touchmove', (e) => {
    if (duckHeld) return;
    e.preventDefault();
    const dy = e.touches[0].clientY - touchStartY;
    if (dy > 24) duck(true);
  }, { passive: false });
  frame.addEventListener('touchend', (e) => {
    if (duckHeld) return;
    e.preventDefault();
    duck(false);
  }, { passive: false });

  // Dedicated duck button: press and hold to crouch, works mid-air too on release
  function duckBtnOn(e) {
    e.preventDefault();
    e.stopPropagation();
    duckHeld = true;
    duckBtn.classList.add('active');
    if (state === 'ready' || state === 'dead') { startGame(); return; }
    duck(true);
  }
  function duckBtnOff(e) {
    e.preventDefault();
    e.stopPropagation();
    duckHeld = false;
    duckBtn.classList.remove('active');
    duck(false);
  }
  duckBtn.addEventListener('touchstart', duckBtnOn, { passive: false });
  duckBtn.addEventListener('touchend', duckBtnOff, { passive: false });
  duckBtn.addEventListener('touchcancel', duckBtnOff, { passive: false });
  duckBtn.addEventListener('mousedown', duckBtnOn);
  window.addEventListener('mouseup', () => { if (duckHeld) duckBtnOff({ preventDefault(){}, stopPropagation(){} }); });

  frame.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target === duckBtn || duckBtn.contains(e.target)) return;
    jump();
  });

  // ---- Obstacle generation ----
  const BRANCH_CLEARANCE = 33; // gap above ground a ducking dino fits under
  const BRANCH_TOP = 158; // how far above ground the branch extends — taller than any jump, so ducking is the only way past

  function spawnObstacle() {
    const r = Math.random();
    if (r < 0.5) {
      // cactus cluster — jump it
      const n = 1 + Math.floor(Math.random() * 3);
      const cw = 16 + n * 8;
      const ch = 38 + Math.random() * 14;
      obstacles.push({
        type: 'cactus',
        x: W + 10,
        w: cw,
        h: ch,
        n: n,
        y: groundY - ch
      });
    } else if (r < 0.78) {
      // pterodactyl — jump or duck depending on lane
      const lane = Math.random();
      const flyH = lane < 0.34 ? 0.9 : lane < 0.67 ? 0.62 : 0.32; // relative to dino height above ground
      const h = 34;
      obstacles.push({
        type: 'bird',
        x: W + 10,
        w: 46,
        h: h,
        y: groundY - dino.h * flyH - h * 0.4,
        wingPhase: Math.random() * Math.PI * 2
      });
    } else {
      // low branch — must duck, too tall to jump over
      obstacles.push({
        type: 'branch',
        x: W + 10,
        w: 60,
        h: BRANCH_TOP - BRANCH_CLEARANCE,
        y: groundY - BRANCH_TOP,
        sway: Math.random() * Math.PI * 2
      });
    }
  }

  function rectsOverlap(a, b) {
    const pad = 6;
    return (
      a.x + pad < b.x + b.w - pad &&
      a.x + a.w - pad > b.x + pad &&
      a.y + pad < b.y + b.h - pad &&
      a.y + a.h - pad > b.y + pad
    );
  }

  // ---- Drawing ----
  function drawGround() {
    ctx.strokeStyle = INK;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = 1;
    const dashLen = 14, gap = 10;
    let x = -(groundOffset % (dashLen + gap));
    while (x < W) {
      ctx.beginPath();
      ctx.moveTo(x, groundY + 6);
      ctx.lineTo(x + dashLen, groundY + 6);
      ctx.stroke();
      x += dashLen + gap;
    }
    ctx.globalAlpha = 1;
  }

  function drawClouds() {
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.16;
    clouds.forEach(c => {
      const s = c.s;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, 18 * s, 7 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x + 14 * s, c.y - 4 * s, 12 * s, 6 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x - 13 * s, c.y - 2 * s, 10 * s, 5 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawDino() {
    ctx.save();
    ctx.translate(dino.x, dino.y);
    ctx.fillStyle = INK;

    if (dino.ducking && !dino.jumping) {
      // ducking silhouette - low elongated body
      const w = 58, h = dino.h;
      roundRect(4, h - 22, w - 10, 18, 6);
      ctx.fill();
      roundRect(w - 22, h - 30, 20, 20, 5);
      ctx.fill();
      // eye
      ctx.fillStyle = document.getElementById('frame') ? getComputedStyle(frame).backgroundColor : '#fff';
      ctx.fillRect(w - 10, h - 24, 3, 3);
      // legs
      ctx.fillStyle = INK;
      const legOffset = Math.floor(dino.legPhase) % 2 === 0 ? 0 : 6;
      ctx.fillRect(10 + legOffset, h - 4, 6, 6);
      ctx.fillRect(30 - legOffset, h - 4, 6, 6);
    } else {
      const w = dino.w, h = dino.h;
      // body
      roundRect(6, 8, w - 16, h - 20, 6);
      ctx.fill();
      // head
      roundRect(w - 26, 0, 26, 20, 5);
      ctx.fill();
      // eye
      ctx.fillStyle = getComputedStyle(frame).backgroundColor;
      ctx.fillRect(w - 10, 6, 3, 3);
      ctx.fillStyle = INK;
      // tail
      ctx.beginPath();
      ctx.moveTo(6, 14);
      ctx.lineTo(-8, 6);
      ctx.lineTo(6, 22);
      ctx.closePath();
      ctx.fill();
      // arm
      ctx.fillRect(w - 22, h - 26, 4, 10);
      // legs (animated run cycle)
      if (dino.jumping) {
        ctx.fillRect(12, h - 10, 8, 10);
        ctx.fillRect(w - 22, h - 10, 8, 10);
      } else {
        const p = Math.floor(dino.legPhase) % 2 === 0;
        ctx.fillRect(p ? 12 : 18, h - 10, 8, 10);
        ctx.fillRect(p ? w - 22 : w - 26, h - 10, 8, 10);
      }
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawObstacles() {
    ctx.fillStyle = INK;
    obstacles.forEach(o => {
      if (o.type === 'cactus') {
        for (let i = 0; i < o.n; i++) {
          const segW = o.w / o.n;
          const segH = o.h - i * 3;
          roundRect(o.x + i * segW * 0.85, o.y + (o.h - segH), segW * 0.7, segH, 3);
          ctx.fill();
        }
      } else if (o.type === 'branch') {
        ctx.save();
        ctx.translate(o.x, o.y);
        // trunk hanging down from off-canvas top
        roundRect(o.w / 2 - 6, 0, 12, o.h, 5);
        ctx.fill();
        // the low horizontal branch itself, the part that must be ducked under
        const swayY = Math.sin(o.sway) * 2;
        roundRect(4, o.h - 16 + swayY, o.w - 8, 15, 6);
        ctx.fill();
        // a couple of leaf tufts for readability
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.ellipse(10, o.h - 20 + swayY, 7, 5, -0.4, 0, Math.PI * 2);
        ctx.ellipse(o.w - 10, o.h - 22 + swayY, 7, 5, 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
      } else {
        // bird
        const flap = Math.sin(o.wingPhase) * 10;
        ctx.save();
        ctx.translate(o.x, o.y);
        roundRect(10, 8, 22, 12, 6);
        ctx.fill();
        // wings
        ctx.beginPath();
        ctx.moveTo(18, 12);
        ctx.lineTo(4, 12 - flap);
        ctx.lineTo(20, 16);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(26, 12);
        ctx.lineTo(42, 12 - flap);
        ctx.lineTo(24, 16);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    });
  }

  // ---- Update ----
  function update() {
    frameCount++;
    if (state === 'running') {
      speed = baseSpeed + Math.min(6, score / 220);

      // dino physics
      if (dino.jumping) {
        dino.vy += gravity;
        dino.y += dino.vy;
        const floor = groundY - dino.h;
        if (dino.y >= floor) {
          dino.y = floor;
          dino.jumping = false;
          dino.vy = 0;
        }
      }
      dino.legPhase += 0.22 * (speed / baseSpeed);

      // ground scroll
      groundOffset += speed;

      // clouds
      clouds.forEach(c => {
        c.x -= speed * 0.25;
        if (c.x < -30) {
          c.x = W + 30;
          c.y = 20 + Math.random() * (H * 0.35);
        }
      });

      // obstacles
      spawnTimer++;
      if (spawnTimer > nextSpawn) {
        spawnObstacle();
        spawnTimer = 0;
        nextSpawn = Math.max(40, 75 - speed * 3) + Math.random() * 35;
      }
      obstacles.forEach(o => {
        o.x -= speed;
        if (o.type === 'bird') o.wingPhase += 0.18;
        if (o.type === 'branch') o.sway += 0.05;
      });
      obstacles = obstacles.filter(o => o.x + o.w > -10);

      // collision
      const dinoBox = { x: dino.x, y: dino.y, w: dino.w, h: dino.h };
      for (const o of obstacles) {
        if (rectsOverlap(dinoBox, o)) {
          gameOver();
          break;
        }
      }

      // score
      score += speed * 0.045;
      scoreEl.textContent = String(Math.floor(score)).padStart(5, '0');
      if (Math.floor(score) > hi) {
        hiEl.textContent = 'HI ' + String(Math.floor(score)).padStart(5, '0');
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    if (flashTimer > 0) {
      ctx.fillStyle = INK;
      ctx.globalAlpha = flashTimer % 2 === 0 ? 0.12 : 0;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      flashTimer--;
    }

    drawClouds();
    drawGround();
    drawObstacles();
    drawDino();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  titleEl.textContent = 'Dino Run';
  subEl.textContent = 'No internet needed here either. Jump cacti, duck birds, don\u2019t stop.';
  hintEl.textContent = 'Tap or press Space to start';

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
